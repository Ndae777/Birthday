<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Happy Birthday, Mpho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<!-- ============================================================
     EDIT ME: everything you'd want to personalize lives here.
     "photoFile" and "musicFile" are just filenames — put the
     actual files next to this index.html in your GitHub repo.
     ============================================================ -->
<script id="card-config" type="application/json">
{
  "recipientLine": "Happy Birthday",
  "recipientName": "Mpho",
  "subtitle": "My Big Sister",
  "photoFile": "photo.jpg",
  "musicFile": "song.mp3",
  "letter": "Happy Birthday Mpho, my big sister.\n\nI love you wholeheartedly — you are a big blessing to me, mom, dad, Ako and Rea. We can't do it without you in the picture. We love you very much and look forward to the next thing that makes you smile. Every day I pray God protects you and guides your every step to remain within His love.\n\nThere's so much more I wish I could give back for what you've shown me — patience and love, above all. I hope I can mirror your kindness the way you've shown it to me.\n\nThank you, Mpho. God bless every year to come.\n\nHappy Birthday!! I love you."
}
</script>
<style>
  :root{
    --navy-deep: #0a0e24;
    --navy-mid: #131a3d;
    --gold: #e8b94d;
    --gold-soft: #f3d99b;
    --ember: #d9704b;
    --blush: #f2d3c4;
    --paper: #fbf3e6;
    --paper-shade: #efe2cc;
    --ink: #2b2a2e;
    --page-w: 220px;
    --top-h: 293px;
    --bottom-h: 293px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background: radial-gradient(ellipse at 50% -10%, #1c2456 0%, var(--navy-deep) 55%, #05071a 100%);
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
    overscroll-behavior: none;
  }
  #sky{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }
  .scene{
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4vh;
    perspective: 1800px;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 12px calc(env(safe-area-inset-bottom, 0px) + 14px);
  }
  /* ---------- Sound toggle ---------- */
  .sound-toggle{
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 16px;
    z-index: 10;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(232,185,77,.4);
    background: rgba(10,14,36,.55);
    backdrop-filter: blur(6px);
    color: var(--gold-soft);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .2s ease, opacity .5s ease;
    opacity: 0;
  }
  .sound-toggle.show{ opacity: 1; }
  .sound-toggle:active{ transform: scale(0.9); }
  /* ---------- Card wrapper : handles the drop-in entrance ---------- */
  .card-wrap{
    position: relative;
    transform: translateY(-140vh) rotate(-10deg);
    opacity: 0;
    transition: transform 1.35s cubic-bezier(.22,1.12,.36,1), opacity .5s ease;
    will-change: transform;
    filter: drop-shadow(0 22px 38px rgba(0,0,0,.55));
  }
  .card-wrap.landed{
    transform: translateY(0) rotate(0deg);
    opacity: 1;
  }
  .card-wrap.settle{
    animation: settle-sway 2.6s ease-in-out 1.35s 1;
  }
  @keyframes settle-sway{
    0%   { transform: translateY(0) rotate(0deg); }
    30%  { transform: translateY(2px) rotate(-1.1deg); }
    60%  { transform: translateY(-1px) rotate(0.7deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  /* ---------- Book / card itself ---------- */
  .book{
    position: relative;
    width: var(--page-w);
    height: var(--top-h);
    transition: width .85s cubic-bezier(.65,0,.35,1), height .85s cubic-bezier(.65,0,.35,1);
    transform-style: preserve-3d;
  }
  .book.open:not(.stacked){
    width: calc(var(--page-w) * 2);
  }
  .book.open.stacked{
    height: calc(var(--top-h) + var(--bottom-h));
  }
  .page{
    position: absolute;
    left: 0;
    width: var(--page-w);
    border-radius: 6px;
    overflow: hidden;
    background: var(--paper);
  }
  .page-left{
    top: 0;
    height: var(--top-h);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 6% 6% 5%;
    background:
      linear-gradient(90deg, rgba(0,0,0,.14), rgba(0,0,0,0) 6%),
      var(--paper);
    box-shadow: inset -10px 0 22px -18px rgba(0,0,0,.55);
  }
  .page-left .frame{
    width: 100%;
    flex: 0 0 auto;
    aspect-ratio: 3 / 4;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(0,0,0,.28), 0 0 0 5px #fff, 0 0 0 6px rgba(0,0,0,.08);
    margin-bottom: 6%;
  }
  .page-left .frame img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .page-left .caption{
    font-family: 'Alex Brush', cursive;
    color: var(--ember);
    font-size: clamp(1.15rem, 6.4vw, 1.55rem);
    line-height: 1.12;
    text-align: center;
    margin: 0;
  }
  .page-left .caption .sub{
    display:block;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.44em;
    letter-spacing: .05em;
    color: var(--ink);
    margin-top: .3em;
  }
  .page-right{
    top: 0;
    left: var(--page-w);
    height: var(--top-h);
    z-index: 1;
    padding: 8% 7%;
    opacity: 0;
    transform: translateX(-14px);
    transition: opacity .6s ease .45s, transform .6s ease .45s;
    background:
      linear-gradient(90deg, rgba(0,0,0,.16), rgba(0,0,0,0) 5%),
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-shade) 28px);
    box-shadow: inset 10px 0 22px -18px rgba(0,0,0,.55);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .book.stacked .page-right{
    left: 0;
    top: var(--top-h);
    height: var(--bottom-h);
    transform: translateY(-10px);
    box-shadow: inset 0 10px 20px -18px rgba(0,0,0,.6);
    background:
      linear-gradient(180deg, rgba(0,0,0,.14), rgba(0,0,0,0) 6%),
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-shade) 28px);
  }
  .book.open .page-right{
    opacity: 1;
    transform: translateX(0);
  }
  .book.open.stacked .page-right{
    transform: translateY(0);
  }
  .page-right::-webkit-scrollbar{ width: 4px; }
  .page-right::-webkit-scrollbar-thumb{ background: rgba(0,0,0,.15); border-radius: 3px; }
  .letter-text{
    font-family: 'Caveat', cursive;
    font-weight: 600;
    color: var(--ink);
    font-size: clamp(0.9rem, 4.4vw, 1.18rem);
    line-height: 1.42;
    white-space: pre-wrap;
    margin: 0;
  }
  .letter-cursor{
    display: inline-block;
    width: 2px;
    background: var(--ink);
    margin-left: 2px;
    animation: blink 0.9s steps(1) infinite;
    vertical-align: -0.15em;
    height: 0.9em;
  }
  @keyframes blink{ 50%{ opacity: 0; } }
  /* ---------- Cover ---------- */
  .cover{
    top: 0;
    left: 0;
    height: var(--top-h);
    z-index: 3;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1.05s cubic-bezier(.55,0,.3,1);
    cursor: pointer;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .book.open .cover{
    transform: rotateY(-170deg);
  }
  .cover-face{
    position: absolute;
    inset: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 6px;
    overflow: hidden;
    transform: translateZ(0.01px);
  }
  .cover-front img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .cover-front .scrim{
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,10,25,.05) 0%, rgba(10,10,25,.05) 42%, rgba(10,10,25,.78) 100%);
  }
  .cover-front .title-block{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 6% 6% 8%;
    text-align: center;
    color: var(--paper);
  }
  .cover-front .title-block h1{
    font-family: 'Alex Brush', cursive;
    font-weight: 400;
    font-size: clamp(1.4rem, 8.5vw, 1.9rem);
    margin: 0 0 .05em;
    color: var(--gold-soft);
    text-shadow: 0 2px 14px rgba(0,0,0,.55);
  }
  .cover-front .title-block h2{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(.8rem, 4vw, 1rem);
    margin: 0;
    letter-spacing: .03em;
    color: var(--paper);
  }
  .cover-back{
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-shade) 28px);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotateY(180deg) translateZ(0.01px);
  }
  .cover-back span{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: rgba(43,42,46,.35);
    font-size: .85rem;
    letter-spacing: .08em;
  }
  /* ---------- Wax seal ---------- */
  .seal{
    position: absolute;
    right: 8%;
    bottom: 9%;
    width: clamp(38px, 15vw, 50px);
    height: clamp(38px, 15vw, 50px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e8926a, var(--ember) 60%, #a8492b 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.15);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 4;
    animation: pulse-seal 2.2s ease-in-out infinite;
  }
  .seal svg{ width: 55%; height: 55%; opacity: .92; }
  @keyframes pulse-seal{
    0%, 100% { transform: scale(1); box-shadow: 0 4px 10px rgba(0,0,0,.45), 0 0 0 0 rgba(232,185,77,.45); }
    50%      { transform: scale(1.06); box-shadow: 0 4px 14px rgba(0,0,0,.5), 0 0 0 9px rgba(232,185,77,0); }
  }
  .book.open .seal{ display:none; }
  /* ---------- Prompt ---------- */
  .prompt{
    color: var(--gold-soft);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(.85rem, 3.6vw, 1.05rem);
    letter-spacing: .06em;
    opacity: 0;
    transition: opacity .8s ease;
    text-align: center;
    text-shadow: 0 0 12px rgba(232,185,77,.35);
    min-height: 1.4em;
  }
  .prompt.show{ opacity: .85; }
  .prompt.hide{ opacity: 0; }
  @media (prefers-reduced-motion: reduce){
    .card-wrap, .book, .cover, .page-right, .prompt{ transition: none !important; animation: none !important; }
    .card-wrap{ transform: none; opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<button class="sound-toggle" id="soundToggle" aria-label="Toggle music">♪</button>
<div class="scene">
  <div class="card-wrap" id="cardWrap">
    <div class="book" id="book">
      <div class="page page-left" id="pageLeft">
        <div class="frame"><img id="insidePhoto" src="" alt=""></div>
        <p class="caption" id="captionText"></p>
      </div>
      <div class="page page-right">
        <p class="letter-text" id="letterText"><span class="letter-cursor" id="cursor"></span></p>
      </div>
      <div class="page cover" id="cover">
        <div class="cover-face cover-front">
          <img id="coverPhoto" src="" alt="">
          <div class="scrim"></div>
          <div class="title-block">
            <h1 id="coverTitle"></h1>
            <h2 id="coverSubtitle"></h2>
          </div>
          <div class="seal" id="seal" aria-label="Open the card">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3 L14.2 9.2 L20.8 9.4 L15.6 13.3 L17.5 19.6 L12 15.9 L6.5 19.6 L8.4 13.3 L3.2 9.4 L9.8 9.2 Z" fill="#fbf3e6"/>
            </svg>
          </div>
        </div>
        <div class="cover-face cover-back"><span>for you</span></div>
      </div>
    </div>
  </div>
  <div class="prompt" id="prompt">✦ tap the seal to open ✦</div>
</div>
<script>
(function(){
  "use strict";
  var config = JSON.parse(document.getElementById('card-config').textContent);

  /* FIX: the old code pointed both images at a base64 string that was
     never actually filled in ("__COVER_B64__" was a leftover template
     placeholder), so both photos were permanently broken. Point them at
     a real file instead — see the "photoFile" key in the config block
     and the repo layout notes below. */
  var PHOTO_SRC = config.photoFile || 'photo.jpg';
  document.getElementById('coverPhoto').src = PHOTO_SRC;
  document.getElementById('insidePhoto').src = PHOTO_SRC;

  document.getElementById('coverTitle').textContent = config.recipientLine + ", " + config.recipientName;
  document.getElementById('coverSubtitle').textContent = config.subtitle;
  document.getElementById('captionText').innerHTML =
    config.recipientLine + " " + config.recipientName + "<span class='sub'>" + config.subtitle + "</span>";
  /* =====================================================
     Responsive sizing. Rather than guessing a height up
     front, this sizes the card's WIDTH to fit the screen,
     then measures how tall the photo+caption page actually
     renders at that width, and sizes everything else from
     that real measurement — so the caption never gets
     clipped and the letter page never overlaps it.
     ===================================================== */
  var root = document.documentElement;
  var bookEl = null;
  var pageLeftEl = null;
  var isStacked = false;
  function computeLayout(){
    var vv = window.visualViewport;
    var vw = vv ? vv.width : window.innerWidth;
    var vh = vv ? vv.height : window.innerHeight;
    isStacked = vw < 640;
    var marginX = vw * (isStacked ? 0.045 : 0.05);
    var availW = vw - marginX * 2;
    var reserveTop = Math.max(vh * 0.065, 40);
    var reserveBottom = Math.max(vh * 0.06, 34);
    var availH = vh - reserveTop - reserveBottom;
    var pageW;
    if (isStacked){
      pageW = Math.min(availW, 380);
    } else {
      pageW = Math.min(availW / 2, 300);
    }
    var minPageW = 150;
    if (pageW < minPageW) pageW = minPageW;
    root.style.setProperty('--page-w', pageW.toFixed(1) + 'px');
    if (bookEl){ bookEl.classList.toggle('stacked', isStacked); }
    var topH, bottomH;
    if (isStacked){
      /* Guarantee the letter page always gets a real, reachable share
         of the screen instead of being pushed off the bottom. */
      var minBottom = Math.max(availH * 0.34, 190);
      topH = Math.min(availH - minBottom, pageW * 1.32, 460);
      if (topH < 180) topH = Math.max(Math.min(180, availH * 0.5), 120);
      bottomH = Math.max(availH - topH, 170);
    } else {
      topH = Math.min(availH, 460, pageW * 1.32);
      bottomH = topH;
    }
    root.style.setProperty('--top-h', topH.toFixed(1) + 'px');
    root.style.setProperty('--bottom-h', bottomH.toFixed(1) + 'px');
  }
  bookEl = document.getElementById('book');
  pageLeftEl = document.getElementById('pageLeft');
  computeLayout();
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(computeLayout);
  }
  window.addEventListener('resize', computeLayout);
  window.addEventListener('orientationchange', computeLayout);
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', computeLayout);
  }
  /* =====================================================
     Starfield + fireworks — single canvas, ambient + bursts
     ===================================================== */
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var W, H, DPR;
  function resizeSky(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
  }
  var stars = [];
  function buildStars(){
    stars = [];
    var count = Math.floor((W * H) / 7000);
    for (var i = 0; i < count; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.85,
        r: Math.random() * 1.2 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.8
      });
    }
  }
  var particles = [];
  function spawnBurst(x, y, opts){
    opts = opts || {};
    var count = opts.count || 40;
    var palette = opts.palette || ['#e8b94d', '#f3d99b', '#d9704b', '#f2d3c4', '#ffffff'];
    var power = opts.power || 1;
    for (var i = 0; i < count; i++){
      var angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
      var speed = (1.5 + Math.random() * 2.2) * power;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0,
        maxLife: 50 + Math.random() * 32,
        color: palette[Math.floor(Math.random() * palette.length)],
        size: 1.3 + Math.random() * 1.6,
        gravity: 0.026
      });
    }
  }
  var activeRockets = [];
  function spawnRocket(){
    var x = W * (0.12 + Math.random() * 0.76);
    var targetY = H * (0.14 + Math.random() * 0.26);
    var rocket = {
      x: x, y: H, targetY: targetY,
      vy: -(6 + Math.random() * 2),
      trail: []
    };
    var entry = {rocket: rocket, timer: null};
    entry.timer = setInterval(function(){
      rocket.y += rocket.vy;
      rocket.trail.push({x: rocket.x, y: rocket.y});
      if (rocket.trail.length > 9) rocket.trail.shift();
      if (rocket.y <= rocket.targetY){
        clearInterval(entry.timer);
        var idx = activeRockets.indexOf(entry);
        if (idx > -1) activeRockets.splice(idx, 1);
        spawnBurst(rocket.x, rocket.y, {count: 36, power: 0.8});
      }
    }, 16);
    activeRockets.push(entry);
  }
  var ambientTimer = null;
  function ambientLoop(){
    if (Math.random() < 0.5) spawnRocket();
    ambientTimer = setTimeout(ambientLoop, 2800 + Math.random() * 3200);
  }
  function drawStars(t){
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var tw = 0.55 + 0.45 * Math.sin(t * 0.001 * s.speed + s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + tw * 0.55) + ')';
      ctx.fill();
    }
  }
  function drawRockets(){
    for (var i = 0; i < activeRockets.length; i++){
      var tr = activeRockets[i].rocket.trail;
      for (var j = 0; j < tr.length; j++){
        var p = tr[j];
        var a = (j + 1) / tr.length;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(243,217,155,' + (a * 0.8) + ')';
        ctx.fill();
      }
    }
  }
  function drawParticles(){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.life++;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.985;
      var t = p.life / p.maxLife;
      if (t >= 1){ particles.splice(i, 1); continue; }
      var alpha = 1 - t;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1 - t * 0.4), 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba(p.color, alpha);
      ctx.fill();
    }
    ctx.restore();
  }
  function hexToRgba(hex, a){
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function frame(t){
    ctx.clearRect(0, 0, W, H);
    drawStars(t);
    drawRockets();
    drawParticles();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resizeSky);
  resizeSky();
  requestAnimationFrame(frame);
  /* =====================================================
     Background music — plays a real audio file of your
     choosing. Drop an MP3 next to this index.html on
     GitHub, name it to match "musicFile" in the config
     block above (default: song.mp3), and it plays the
     moment she taps to open the card — that tap satisfies
     mobile browsers' autoplay-with-sound rule. If no
     matching file is found, playback just silently no-ops.
     ===================================================== */
  var muted = false;
  var soundToggle = document.getElementById('soundToggle');
  var musicStarted = false;
  var bgm = null;
  if (config.musicFile){
    bgm = new Audio(config.musicFile);
    bgm.loop = true;
    bgm.preload = 'auto';
    bgm.volume = 0;
    /* FIX: silently flag a missing/broken audio file instead of
       leaving the toggle looking active with nothing to control. */
    bgm.addEventListener('error', function(){
      soundToggle.style.opacity = '.35';
      soundToggle.title = 'Music file not found';
    });
  } else {
    soundToggle.style.display = 'none';
  }
  function fadeVolume(from, to, duration){
    if (!bgm) return;
    var start = performance.now();
    function step(now){
      var t = Math.min((now - start) / duration, 1);
      bgm.volume = from + (to - from) * t;
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function startMusic(){
    if (!bgm || muted) return;
    musicStarted = true;
    var p = bgm.play();
    if (p && p.catch){
      p.catch(function(){
        soundToggle.style.opacity = '.45';
      });
    }
    fadeVolume(0, 0.55, 1400);
  }
  soundToggle.addEventListener('click', function(e){
    e.stopPropagation();
    muted = !muted;
    soundToggle.textContent = muted ? '✕' : '♪';
    soundToggle.setAttribute('aria-label', muted ? 'Music off' : 'Music on');
    if (!bgm) return;
    if (muted){
      fadeVolume(bgm.volume, 0, 300);
    } else if (musicStarted){
      bgm.play().catch(function(){});
      fadeVolume(bgm.volume, 0.55, 300);
    } else {
      startMusic();
    }
  });
  /* =====================================================
     Card entrance -> celebratory burst -> open prompt
     ===================================================== */
  var cardWrap = document.getElementById('cardWrap');
  var book = document.getElementById('book');
  var seal = document.getElementById('seal');
  var prompt = document.getElementById('prompt');
  var cover = document.getElementById('cover');
  var pageRight = document.querySelector('.page-right');
  var opened = false;
  var typed = false;
  function landingBurst(){
    spawnBurst(W * 0.5, H * 0.32, {count: 64, power: 1.25});
    setTimeout(function(){
      spawnBurst(W * 0.32, H * 0.4, {count: 42, power: 1});
      spawnBurst(W * 0.68, H * 0.4, {count: 42, power: 1});
    }, 220);
  }
  window.addEventListener('load', function(){
    setTimeout(function(){ cardWrap.classList.add('landed'); }, 260);
    setTimeout(function(){
      landingBurst();
      cardWrap.classList.add('settle');
    }, 1350);
    setTimeout(function(){
      prompt.classList.add('show');
      soundToggle.classList.add('show');
    }, 2000);
    ambientLoop();
  });
  function openCard(){
    if (opened) return;
    opened = true;
    prompt.classList.remove('show');
    prompt.classList.add('hide');
    book.classList.add('open');
    var rect = book.getBoundingClientRect();
    spawnBurst(rect.left + rect.width * 0.25, rect.top + rect.height * 0.15, {count: 54, power: 1.1});
    setTimeout(function(){
      spawnBurst(rect.left + rect.width * 0.75, rect.top + rect.height * 0.15, {count: 54, power: 1.1});
    }, 260);
    startMusic();
    setTimeout(function(){
      if (!typed){
        typed = true;
        typeLetter();
      }
    }, 850);
  }
  seal.addEventListener('click', function(e){ e.stopPropagation(); openCard(); });
  cover.addEventListener('click', openCard);
  /* =====================================================
     Handwriting reveal for the letter, auto-scrolling
     the page as new lines appear so the newest text
     always stays in view.
     ===================================================== */
  function typeLetter(){
    var target = document.getElementById('letterText');
    var cursor = document.getElementById('cursor');
    var text = config.letter;
    var i = 0;
    function step(){
      if (i >= text.length){
        cursor.style.opacity = 0.35;
        return;
      }
      var ch = text.charAt(i);
      var node = document.createTextNode(ch);
      target.insertBefore(node, cursor);
      i++;
      pageRight.scrollTop = pageRight.scrollHeight;
      var delay;
      if (ch === '\n') delay = 220;
      else if (ch === ',' || ch === '.' || ch === '!') delay = 130;
      else if (ch === ' ') delay = 34;
      else delay = 24 + Math.random() * 26;
      setTimeout(step, delay);
    }
    step();
  }
})();
</script>
</body>
