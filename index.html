<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1c">
<title>Happy Birthday, Mpho</title>

<!-- Link preview when the card is shared on WhatsApp / iMessage.
     og:image must be a FULL url — change it if your repo path changes. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Happy Birthday, Mpho">
<meta property="og:description" content="A little card for my big sister — tap to open.">
<meta property="og:image" content="https://ndae777.github.io/photo.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

<!-- ============================================================
     EDIT ME — everything personal lives in this one block.
     photoFile / musicFile are just filenames: put the real files
     next to this index.html in your GitHub repo.

     photoPosition controls the crop on the cover. The photo is
     cropped to fill, so if her face sits high in the frame use a
     smaller percentage ("center 25%"); lower it to show more.
     ============================================================ -->
<script id="card-config" type="application/json">
{
  "recipientLine": "Happy Birthday",
  "recipientName": "Mpho",
  "subtitle": "My Big Sister",
  "photoFile": "photo.jpg",
  "photoPosition": "center 28%",
  "insidePhotoFile": "",
  "insidePhotoPosition": "center 35%",
  "musicFile": "song.mp3",
  "letter": "Happy Birthday Mpho, my big sister.\n\nI love you wholeheartedly — you are a big blessing to me, mom, dad, Ako and Rea. We can't do it without you in the picture. We love you very much and look forward to the next thing that makes you smile. Every day I pray God protects you and guides your every step to remain within His love.\n\nThere's so much more I wish I could give back for what you've shown me — patience and love, above all. I hope I can mirror your kindness the way you've shown it to me.\n\nThank you, Mpho. God bless every year to come.\n\nHappy Birthday!! I love you.",
  "signature": "",
  "footer": "made with love"
}
</script>

<style>
/* ============================================================
   1 · TOKENS
   ============================================================ */
:root{
  --navy-deep:#070a1c;
  --navy-mid:#161e4c;
  --gold:#e8b94d;
  --gold-soft:#f6e2af;
  --ember:#d9704b;
  --ember-deep:#a8492b;
  --paper:#fdf6ea;
  --paper-2:#f7eddc;
  --ink:#2b2a2e;
  --ink-soft:#6a6270;

  /* One page width drives the whole card. No JS measuring. */
  --page-w: min(90vw, 400px);
  --page-h: min(calc(var(--page-w) * 1.6), 76vh);
  --r: 16px;
  --rule: 30px;   /* ruled-line spacing on the letter page */
  --pad: 26px;    /* letter page top padding (rules align to it) */
}
@supports (height: 1dvh){
  :root{ --page-h: min(calc(var(--page-w) * 1.6), 76dvh); }
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html{ overflow-x:hidden; }

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(ellipse at 50% -12%, #232c68 0%, var(--navy-mid) 32%, var(--navy-deep) 66%, #03050f 100%);
  background-attachment:fixed;
  font-family:'Cormorant Garamond', serif;
  color:var(--paper);
  overscroll-behavior-y:none;
  touch-action:manipulation;
}

/* soft vignette over the sky, under the card */
body::after{
  content:'';
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 38%, rgba(0,0,0,.5) 100%);
}

#sky{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }

/* ============================================================
   2 · STAGE  (auto margins centre the card AND stay scrollable
   once the card grows taller than the screen)
   ============================================================ */
.stage{
  position:relative; z-index:2;
  min-height:100vh;
  min-height:100dvh;
  display:flex; flex-direction:column; align-items:center;
  gap: clamp(14px, 3.2vh, 28px);
  padding:
    calc(env(safe-area-inset-top, 0px) + 18px)
    12px
    calc(env(safe-area-inset-bottom, 0px) + 30px);
}
.card-wrap{
  margin-top:auto;
  width:var(--page-w);
  perspective:1400px;
  transform: translateY(-125vh) rotate(-9deg);
  opacity:0;
  transition: transform 1.3s cubic-bezier(.2,1.08,.35,1), opacity .5s ease;
  will-change: transform;
}
.card-wrap.landed{ transform:none; opacity:1; }
.card-wrap.settle{ animation: sway 2.4s ease-in-out 1.3s 1; }
@keyframes sway{
  0%,100%{ transform:translateY(0) rotate(0); }
  32%{ transform:translateY(2px) rotate(-1deg); }
  64%{ transform:translateY(-1px) rotate(.6deg); }
}
.prompt{
  margin-bottom:auto;
  font-style:italic;
  font-size: clamp(.85rem, 3.6vw, 1.05rem);
  letter-spacing:.08em;
  color:var(--gold-soft);
  text-shadow:0 0 14px rgba(232,185,77,.4);
  opacity:0;
  transition: opacity .8s ease;
  text-align:center;
  min-height:1.4em;
}
.prompt.show{ opacity:.85; }

.card{ position:relative; width:100%; transform-style:preserve-3d; }

/* ============================================================
   3 · INSIDE  (clipped to exactly the cover height when closed,
   so nothing ever peeks out underneath)
   ============================================================ */
.inside{
  position:relative;
  border-radius:var(--r);
  overflow:hidden;
  background:var(--paper);
  min-height:var(--page-h);
  max-height:var(--page-h);
  box-shadow:0 20px 44px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  transition: max-height 1.2s cubic-bezier(.55,0,.2,1);
}
.card.open .inside{ max-height:600vh; }

.photo-page{
  padding: 8% 8% 6%;
  display:flex; flex-direction:column; align-items:center;
  background: linear-gradient(180deg, #fffaf1 0%, var(--paper) 62%);
}
.polaroid{
  margin:0; width:100%;
  background:#fff;
  padding: 4.5% 4.5% 5.5%;
  border-radius:4px;
  box-shadow:0 12px 26px rgba(43,42,46,.22), 0 1px 0 rgba(0,0,0,.06);
  transform: rotate(-1.1deg);
}
.shot{
  aspect-ratio:3/4;
  overflow:hidden;
  border-radius:2px;
  background: linear-gradient(160deg,#e9dfd0,#d8cab6);
  display:grid; place-items:center;
}
.shot img{ width:100%; height:100%; object-fit:cover; object-position:var(--inside-pos, center); display:block; }
.shot.no-photo::after{
  content: attr(data-initial);
  font-family:'Alex Brush',cursive;
  font-size:4rem; color:#fff; opacity:.8;
}
.polaroid figcaption{ padding-top:6%; text-align:center; }
.cap-name{
  font-family:'Alex Brush',cursive;
  color:var(--ember);
  font-size: clamp(1.4rem, 7.2vw, 1.95rem);
  line-height:1.04; margin:0;
}
.cap-sub{
  font-family:'Playfair Display',serif; font-style:italic;
  color:var(--ink-soft);
  font-size: clamp(.78rem, 3.5vw, .95rem);
  letter-spacing:.05em; margin:.3em 0 0;
}

.divider{
  display:flex; align-items:center; gap:10px;
  padding: 6% 10% 0;
  width:100%;
  color:var(--ember);
}
.divider i{ flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(217,112,75,.45),transparent); }
.divider b{ font-style:normal; font-weight:400; font-size:.8rem; opacity:.75; }

/* ---- letter ---- */
.letter-page{
  padding: var(--pad) 8% 14%;
  background-color:var(--paper-2);
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent calc(var(--rule) - 1px),
    rgba(43,42,46,.085) calc(var(--rule) - 1px),
    rgba(43,42,46,.085) var(--rule)
  );
  background-position: 0 var(--pad);
  box-shadow: inset 0 12px 18px -16px rgba(0,0,0,.5);
}
.letter{
  font-family:'Caveat',cursive; font-weight:600;
  color:var(--ink);
  font-size: clamp(1.02rem, 4.6vw, 1.24rem);
  line-height: var(--rule);
  white-space: pre-wrap;
  margin:0;
  overflow-wrap:break-word;
}
.cursor{
  display:inline-block; width:2px; height:.92em;
  background:var(--ink); margin-left:2px;
  vertical-align:-.14em;
  animation: blink .9s steps(1) infinite;
}
@keyframes blink{ 50%{ opacity:0; } }
.sign-off{
  margin: 1.6em 0 0;
  text-align:right;
  font-family:'Alex Brush',cursive;
  color:var(--ember);
  font-size: clamp(1.3rem, 6vw, 1.6rem);
  opacity:0; transition:opacity .9s ease;
}
.closing{
  margin:2.2em 0 0;
  text-align:center;
  font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:.82rem; letter-spacing:.22em; text-transform:lowercase;
  color:rgba(107,98,112,.65);
  opacity:0; transition:opacity .9s ease .25s;
}
.card.done .sign-off, .card.done .closing{ opacity:1; }

/* ============================================================
   4 · COVER
   ============================================================ */
.cover{
  position:absolute; top:0; left:0;
  width:100%; height:var(--page-h);
  z-index:3;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition: transform 1.15s cubic-bezier(.6,.02,.25,1), opacity .55s ease .7s;
  cursor:pointer;
  -webkit-touch-callout:none;
  -webkit-user-select:none; user-select:none;
}
.card.open .cover{ transform: rotateY(-165deg); opacity:0; pointer-events:none; }

.cover-face{
  position:absolute; inset:0;
  border-radius:var(--r);
  overflow:hidden;
  -webkit-backface-visibility:hidden; backface-visibility:hidden;
  box-shadow:0 20px 44px rgba(0,0,0,.55);
}
.cover-front{
  transform: translateZ(1px);
  display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
  text-align:center;
  padding: 0 8% 6.5%;
  background: linear-gradient(150deg, #2b3570, #121736);
}
.cover-front img{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover; object-position:var(--cover-pos, center 30%);
  display:block;
}
.scrim{
  position:absolute; inset:0;
  background: linear-gradient(180deg,
    rgba(6,8,22,.38) 0%,
    rgba(6,8,22,.04) 24%,
    rgba(6,8,22,.30) 54%,
    rgba(6,8,22,.88) 100%);
}
.gilt{
  position:absolute; inset:9px;
  border:1px solid rgba(246,226,175,.4);
  border-radius: calc(var(--r) - 7px);
  pointer-events:none;
}
.title-block{ position:relative; z-index:2; width:100%; }
.eyebrow{
  margin:0 0 .5em;
  font-size: clamp(.6rem, 3vw, .78rem);
  letter-spacing:.34em; text-indent:.34em;
  text-transform:uppercase;
  color:var(--gold);
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}
.name{
  margin:0;
  font-family:'Alex Brush',cursive; font-weight:400;
  font-size: clamp(2.6rem, 15vw, 3.6rem);
  line-height:.98;
  color:#fffaf0;
  text-shadow:0 0 30px rgba(232,185,77,.45), 0 4px 18px rgba(0,0,0,.75);
}
.flourish{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin:.55em auto .5em; width:72%;
  color:var(--gold);
}
.flourish i{ flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(232,185,77,.7),transparent); }
.flourish b{ font-weight:400; font-style:normal; font-size:.75rem; }
.sub{
  margin:0;
  font-family:'Playfair Display',serif; font-style:italic;
  font-size: clamp(.85rem, 4vw, 1.02rem);
  letter-spacing:.04em;
  color:var(--paper);
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}

.seal{
  position:relative; z-index:2;
  margin-top: clamp(14px, 3vh, 22px);
  width: clamp(48px, 14vw, 62px);
  height: clamp(48px, 14vw, 62px);
  border:0; padding:0;
  border-radius:50%;
  background: radial-gradient(circle at 34% 28%, #f0a077, var(--ember) 58%, var(--ember-deep) 100%);
  box-shadow:0 6px 14px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.18);
  display:grid; place-items:center;
  cursor:pointer;
  animation: pulse 2.4s ease-in-out infinite;
}
.seal svg{ width:52%; height:52%; }
.seal:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:4px; }
@keyframes pulse{
  0%,100%{ transform:scale(1); box-shadow:0 6px 14px rgba(0,0,0,.5), 0 0 0 0 rgba(232,185,77,.45), inset 0 0 0 2px rgba(255,255,255,.18); }
  50%    { transform:scale(1.06); box-shadow:0 6px 18px rgba(0,0,0,.55), 0 0 0 11px rgba(232,185,77,0), inset 0 0 0 2px rgba(255,255,255,.18); }
}

.cover-back{
  transform: rotateY(180deg) translateZ(1px);
  background: var(--paper-2);
  display:grid; place-items:center;
}
.cover-back span{ font-style:italic; color:rgba(43,42,46,.32); letter-spacing:.12em; font-size:.9rem; }

/* ============================================================
   5 · FIXED CONTROLS
   ============================================================ */
.sound{
  position:fixed; z-index:20;
  right:14px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width:42px; height:42px;
  border-radius:50%;
  border:1px solid rgba(232,185,77,.42);
  background:rgba(10,14,36,.6);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  color:var(--gold-soft);
  font-size:16px;
  display:grid; place-items:center;
  cursor:pointer;
  opacity:0; transition:opacity .6s ease, transform .18s ease;
}
.sound.show{ opacity:1; }
.sound:active{ transform:scale(.9); }

.hint{
  position:fixed; z-index:19;
  left:50%; transform:translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  max-width:64vw;
  padding:7px 16px;
  border-radius:999px;
  border:1px solid rgba(232,185,77,.25);
  background:rgba(10,14,36,.62);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  color:var(--gold-soft);
  font-style:italic; font-size:.82rem; letter-spacing:.05em;
  text-align:center;
  opacity:0; pointer-events:none;
  transition:opacity .6s ease;
}
.hint.show{ opacity:.9; }

/* ============================================================
   6 · SHORT / LANDSCAPE SCREENS
   ============================================================ */
@media (max-height: 540px){
  :root{ --page-w: min(70vw, 330px); }
  .name{ font-size: clamp(2rem, 8vh, 2.6rem); }
  .seal{ width:44px; height:44px; margin-top:10px; }
  .cover-front{ padding-bottom:5%; }
}

@media (prefers-reduced-motion: reduce){
  .card-wrap, .cover, .inside, .prompt, .sound, .hint, .sign-off, .closing{
    transition:none !important; animation:none !important;
  }
  .card-wrap{ transform:none; opacity:1; }
  .seal{ animation:none !important; }
}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<main class="stage">
  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card">

      <div class="inside" id="inside">
        <section class="photo-page">
          <figure class="polaroid">
            <div class="shot" id="shot"><img id="insidePhoto" alt=""></div>
            <figcaption>
              <p class="cap-name" id="capName"></p>
              <p class="cap-sub" id="capSub"></p>
            </figcaption>
          </figure>
          <div class="divider"><i></i><b>&#10022;</b><i></i></div>
        </section>

        <section class="letter-page" id="letterPage">
          <p class="letter" id="letterText"><span class="cursor" id="cursor"></span></p>
          <p class="sign-off" id="signOff"></p>
          <p class="closing" id="closing"></p>
        </section>
      </div>

      <div class="cover" id="cover">
        <div class="cover-face cover-front" id="coverFront">
          <img id="coverPhoto" alt="">
          <div class="scrim"></div>
          <div class="gilt"></div>
          <div class="title-block">
            <p class="eyebrow" id="eyebrow"></p>
            <h1 class="name" id="coverName"></h1>
            <div class="flourish"><i></i><b>&#10022;</b><i></i></div>
            <p class="sub" id="coverSub"></p>
          </div>
          <button class="seal" id="seal" aria-label="Open the card">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3 L14.2 9.2 L20.8 9.4 L15.6 13.3 L17.5 19.6 L12 15.9 L6.5 19.6 L8.4 13.3 L3.2 9.4 L9.8 9.2 Z" fill="#fdf6ea"/>
            </svg>
          </button>
        </div>
        <div class="cover-face cover-back"><span>for you</span></div>
      </div>

    </div>
  </div>

  <p class="prompt" id="prompt">&#10022; tap the seal to open &#10022;</p>
</main>

<button class="sound" id="sound" aria-label="Turn music on or off">&#9834;</button>
<div class="hint" id="hint"></div>

<script>
(function(){
"use strict";

/* ---------- config ---------- */
var DEFAULTS = {
  recipientLine:"Happy Birthday", recipientName:"", subtitle:"",
  photoFile:"photo.jpg", photoPosition:"center 30%",
  insidePhotoFile:"", insidePhotoPosition:"center center",
  musicFile:"song.mp3", letter:"", signature:"", footer:""
};
var cfg = {};
try{ cfg = JSON.parse(document.getElementById('card-config').textContent) || {}; }
catch(err){ console.warn('Card settings could not be read, using defaults.', err); }
for (var k in DEFAULTS){ if (cfg[k] === undefined || cfg[k] === null) cfg[k] = DEFAULTS[k]; }

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- fill in the card ---------- */
var root       = document.documentElement;
var card       = document.getElementById('card');
var cardWrap   = document.getElementById('cardWrap');
var cover      = document.getElementById('cover');
var coverFront = document.getElementById('coverFront');
var seal       = document.getElementById('seal');
var prompt     = document.getElementById('prompt');
var inside     = document.getElementById('inside');
var shot       = document.getElementById('shot');
var hint       = document.getElementById('hint');
var soundBtn   = document.getElementById('sound');

document.getElementById('eyebrow').textContent  = cfg.recipientLine;
document.getElementById('coverName').textContent = cfg.recipientName;
document.getElementById('coverSub').textContent  = cfg.subtitle;
document.getElementById('capName').textContent   = cfg.recipientLine + ' ' + cfg.recipientName;
document.getElementById('capSub').textContent    = cfg.subtitle;
document.getElementById('signOff').textContent   = cfg.signature;
document.getElementById('closing').textContent   = cfg.footer;
document.title = cfg.recipientLine + ', ' + cfg.recipientName;

root.style.setProperty('--cover-pos', cfg.photoPosition);
root.style.setProperty('--inside-pos', cfg.insidePhotoPosition);
shot.setAttribute('data-initial', (cfg.recipientName || '?').charAt(0));

var coverImg  = document.getElementById('coverPhoto');
var insideImg = document.getElementById('insidePhoto');
coverImg.src  = cfg.photoFile;
insideImg.src = cfg.insidePhotoFile || cfg.photoFile;

/* if a photo is missing, fall back to a monogram instead of a broken icon */
coverImg.addEventListener('error', function(){ coverImg.style.display = 'none'; });
insideImg.addEventListener('error', function(){
  insideImg.style.display = 'none';
  shot.classList.add('no-photo');
});

/* ============================================================
   Night sky: stars, fireworks, the odd shooting star
   ============================================================ */
var canvas = document.getElementById('sky');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, stars = [], particles = [], rockets = [], shooting = null;

function resizeSky(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildStars();
}
function buildStars(){
  stars = [];
  var n = Math.min(Math.floor((W * H) / 6500), 220);
  for (var i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.92,
      r: Math.random() * 1.15 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.8
    });
  }
}
function spawnBurst(x, y, opts){
  if (reduce || particles.length > 900) return;
  opts = opts || {};
  var count = opts.count || 40;
  var power = opts.power || 1;
  var palette = ['#e8b94d','#f6e2af','#d9704b','#f2d3c4','#ffffff'];
  for (var i = 0; i < count; i++){
    var a = (Math.PI * 2 * i) / count + Math.random() * 0.22;
    var s = (1.5 + Math.random() * 2.2) * power;
    particles.push({
      x:x, y:y, vx:Math.cos(a) * s, vy:Math.sin(a) * s,
      life:0, max:52 + Math.random() * 34,
      color: palette[(Math.random() * palette.length) | 0],
      size: 1.3 + Math.random() * 1.6
    });
  }
}
function spawnRocket(){
  if (reduce || rockets.length > 3) return;
  rockets.push({
    x: W * (0.12 + Math.random() * 0.76),
    y: H + 8,
    targetY: H * (0.12 + Math.random() * 0.28),
    vy: -(7 + Math.random() * 2.4),
    trail: []
  });
}
var ambientTimer = null;
function ambientLoop(){
  if (!document.hidden && Math.random() < 0.55) spawnRocket();
  ambientTimer = setTimeout(ambientLoop, 3000 + Math.random() * 3600);
}
function hexToRgba(hex, a){
  return 'rgba(' + parseInt(hex.slice(1,3),16) + ',' + parseInt(hex.slice(3,5),16) + ',' + parseInt(hex.slice(5,7),16) + ',' + a + ')';
}
function frame(t){
  ctx.clearRect(0, 0, W, H);

  for (var i = 0; i < stars.length; i++){
    var st = stars[i];
    var tw = 0.55 + 0.45 * Math.sin(t * 0.001 * st.speed + st.phase);
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, 6.283);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.22 + tw * 0.55) + ')';
    ctx.fill();
  }

  if (!reduce && !shooting && Math.random() < 0.0035){
    shooting = { x: Math.random() * W * 0.55, y: Math.random() * H * 0.3, vx: 5 + Math.random() * 3, vy: 1.7 + Math.random(), life: 0 };
  }
  if (shooting){
    shooting.x += shooting.vx; shooting.y += shooting.vy; shooting.life++;
    var fade = Math.max(0, 1 - shooting.life / 70);
    var g = ctx.createLinearGradient(shooting.x, shooting.y, shooting.x - shooting.vx * 12, shooting.y - shooting.vy * 12);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.85 * fade) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(shooting.x, shooting.y);
    ctx.lineTo(shooting.x - shooting.vx * 12, shooting.y - shooting.vy * 12);
    ctx.stroke();
    if (shooting.life > 70 || shooting.x > W) shooting = null;
  }

  for (var r = rockets.length - 1; r >= 0; r--){
    var rk = rockets[r];
    rk.y += rk.vy; rk.vy += 0.05;
    rk.trail.push({ x: rk.x, y: rk.y });
    if (rk.trail.length > 10) rk.trail.shift();
    for (var j = 0; j < rk.trail.length; j++){
      var p = rk.trail[j], a2 = (j + 1) / rk.trail.length;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.2, 0, 6.283);
      ctx.fillStyle = 'rgba(246,226,175,' + (a2 * 0.8) + ')'; ctx.fill();
    }
    if (rk.y <= rk.targetY || rk.vy >= -1.2){
      spawnBurst(rk.x, rk.y, { count: 38, power: 0.9 });
      rockets.splice(r, 1);
    }
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var q = particles.length - 1; q >= 0; q--){
    var pt = particles[q];
    pt.life++; pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.026; pt.vx *= 0.985;
    var k2 = pt.life / pt.max;
    if (k2 >= 1){ particles.splice(q, 1); continue; }
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size * (1 - k2 * 0.4), 0, 6.283);
    ctx.fillStyle = hexToRgba(pt.color, 1 - k2);
    ctx.fill();
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
window.addEventListener('resize', resizeSky);
window.addEventListener('orientationchange', resizeSky);
resizeSky();
requestAnimationFrame(frame);

/* ============================================================
   Music — starts on her tap, which is what mobile browsers need
   ============================================================ */
var bgm = null, muted = false, started = false;
if (cfg.musicFile){
  bgm = new Audio(cfg.musicFile);
  bgm.loop = true; bgm.preload = 'auto'; bgm.volume = 0;
  bgm.addEventListener('error', function(){
    soundBtn.style.display = 'none';   /* no file, no button */
    bgm = null;
  });
} else {
  soundBtn.style.display = 'none';
}
function fadeTo(target, ms){
  if (!bgm) return;
  var from = bgm.volume, t0 = performance.now();
  (function step(now){
    var k = Math.min((now - t0) / ms, 1);
    bgm.volume = Math.max(0, Math.min(1, from + (target - from) * k));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function playMusic(){
  if (!bgm || muted) return;
  started = true;
  var p = bgm.play();
  if (p && p.catch) p.catch(function(){ soundBtn.style.opacity = '.45'; });
  fadeTo(0.55, 1400);
}
soundBtn.addEventListener('click', function(e){
  e.stopPropagation();
  muted = !muted;
  soundBtn.textContent = muted ? '\u2715' : '\u266A';
  soundBtn.setAttribute('aria-label', muted ? 'Turn music on' : 'Turn music off');
  if (!bgm) return;
  if (muted) fadeTo(0, 300);
  else if (started){ bgm.play().catch(function(){}); fadeTo(0.55, 300); }
  else playMusic();
});

/* ============================================================
   Opening sequence
   ============================================================ */
var booted = false;
function boot(){
  if (booted) return;
  booted = true;
  if (reduce){
    cardWrap.classList.add('landed');
    prompt.classList.add('show');
    soundBtn.classList.add('show');
    return;
  }
  setTimeout(function(){ cardWrap.classList.add('landed'); }, 200);
  setTimeout(function(){
    spawnBurst(W * 0.5, H * 0.34, { count: 64, power: 1.25 });
    setTimeout(function(){
      spawnBurst(W * 0.3, H * 0.42, { count: 40 });
      spawnBurst(W * 0.7, H * 0.42, { count: 40 });
    }, 220);
    cardWrap.classList.add('settle');
  }, 1420);
  setTimeout(function(){
    prompt.classList.add('show');
    soundBtn.classList.add('show');
  }, 2000);
  ambientLoop();
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot);
setTimeout(boot, 2200);

var opened = false;
function openCard(){
  if (opened) return;
  opened = true;
  prompt.classList.remove('show');
  card.classList.add('open');
  playMusic();

  var box = card.getBoundingClientRect();
  spawnBurst(box.left + box.width * 0.22, box.top + box.height * 0.16, { count: 54, power: 1.1 });
  setTimeout(function(){
    spawnBurst(box.left + box.width * 0.78, box.top + box.height * 0.16, { count: 54, power: 1.1 });
  }, 240);

  setTimeout(typeLetter, 900);
}
seal.addEventListener('click', function(e){ e.stopPropagation(); openCard(); });
cover.addEventListener('click', openCard);

/* ============================================================
   Handwriting reveal — follows along, tap to see it all at once
   ============================================================ */
var letterEl = document.getElementById('letterText');
var cursor   = document.getElementById('cursor');
var text     = String(cfg.letter || '');
var idx = 0, typing = false, timer = null;
var followPausedUntil = 0, lastFollow = 0;

window.addEventListener('touchmove', function(){ followPausedUntil = Date.now() + 5000; }, { passive: true });
window.addEventListener('wheel',     function(){ followPausedUntil = Date.now() + 5000; }, { passive: true });

function follow(){
  var now = Date.now();
  if (now < followPausedUntil || now - lastFollow < 320) return;
  var r = cursor.getBoundingClientRect();
  var limit = window.innerHeight - 130;
  if (r.bottom > limit){
    lastFollow = now;
    var by = r.bottom - limit + 40;
    if (window.scrollBy) window.scrollBy({ top: by, behavior: 'smooth' });
  }
}
function finish(){
  typing = false;
  cursor.style.display = 'none';
  card.classList.add('done');
  hint.classList.remove('show');
  setTimeout(function(){
    var b = inside.getBoundingClientRect();
    spawnBurst(b.left + b.width * 0.5, Math.max(60, b.top + 80), { count: 46, power: 0.95 });
  }, 400);
}
function revealAll(){
  if (!typing) return;
  clearTimeout(timer);
  letterEl.insertBefore(document.createTextNode(text.slice(idx)), cursor);
  idx = text.length;
  finish();
}
function typeLetter(){
  if (!text){ finish(); return; }
  if (reduce){
    letterEl.insertBefore(document.createTextNode(text), cursor);
    idx = text.length; finish(); return;
  }
  typing = true;
  hint.textContent = 'tap to read it all at once';
  hint.classList.add('show');
  hint.style.pointerEvents = 'auto';

  (function step(){
    if (idx >= text.length){ finish(); return; }
    var ch = text.charAt(idx);
    letterEl.insertBefore(document.createTextNode(ch), cursor);
    idx++;
    follow();
    var d;
    if (ch === '\n') d = 190;
    else if (ch === '.' || ch === ',' || ch === '!' || ch === '?') d = 120;
    else if (ch === ' ') d = 26;
    else d = 16 + Math.random() * 22;
    timer = setTimeout(step, d);
  })();
}
inside.addEventListener('click', revealAll);
hint.addEventListener('click', revealAll);

})();
</script>
